name: Mali native Android emulator acceptance
on:
  push:
    branches: ['codex/mali-production-audit']
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - '.github/workflows/android-acceptance.yml'
permissions:
  contents: read
jobs:
  android-debug:
    name: Android native APK and emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate isolated Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Compile native debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
      - name: Install Android emulator components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
          echo no | avdmanager create avd -n mali-ci -k "system-images;android-35;google_apis;x86_64" --force
      - name: Boot Android emulator and smoke-test Mali
        timeout-minutes: 12
        run: |
          mkdir -p android-acceptance-evidence
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd mali-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > android-acceptance-evidence/emulator.log 2>&1 &
          timeout 420 adb wait-for-device
          deadline=$((SECONDS+420))
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            if [ "$SECONDS" -gt "$deadline" ]; then
              tail -n 120 android-acceptance-evidence/emulator.log
              exit 1
            fi
            sleep 5
          done
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.aybholiday.mali || true
          adb shell monkey -p com.aybholiday.mali -c android.intent.category.LAUNCHER 1
          sleep 18
          APP_PID=$(adb shell pidof com.aybholiday.mali | tr -d '\r')
          if [ -z "$APP_PID" ]; then
            adb logcat -d -t 350 | tail -n 120
            echo "ERROR: Mali native process crashed or failed to launch"
            exit 1
          fi
          adb shell uiautomator dump /sdcard/mali-window.xml || true
          adb pull /sdcard/mali-window.xml android-acceptance-evidence/mali-window.xml || true
          adb shell screencap -p /sdcard/mali-smoke.png
          adb pull /sdcard/mali-smoke.png android-acceptance-evidence/mali-smoke.png
          echo "PASS native Android emulator app process: $APP_PID"
      - name: Upload debug and emulator evidence (never a production release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mali-android-debug-emulator-evidence
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-acceptance-evidence/
